name = "shadow-news"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NEWS_CHANNEL_ID = "1561489312032366692"

# Secrets (never in this file), set with:
#   npx wrangler secret put DISCORD_TOKEN
#   npx wrangler secret put PASSCODE
#   npx wrangler secret put SIGNING_KEY

[ai]
binding = "AI"

# Editions go through a queue: the consumer may run up to 15 minutes, enough for 10 audio clips.
[[queues.producers]]
binding = "EDITIONS"
queue = "shadow-news-editions"

[[queues.consumers]]
queue = "shadow-news-editions"
max_batch_size = 1
max_retries = 0
